# Run the self-contained BKON LightRAG service on any box. Embeddings are local
# (bundled in the image); generation uses your Ollama Cloud subscription, so no
# local model server is needed at all.
#
#   SERVICE_KEY=your-secret  OLLAMA_CLOUD_KEY=your-ollama-key  docker compose up -d
#
# Then point the integration at http://<this-host>:9621 with SERVICE_KEY.

services:
  bkon-lightrag:
    build:
      context: .
      dockerfile: lightrag_service/Dockerfile.standalone
    container_name: bkon-lightrag
    restart: unless-stopped
    ports: ["9621:9621"]
    environment:
      LIGHTRAG_API_KEY: "${SERVICE_KEY:-change-me}"
      OLLAMA_HOST: "https://ollama.com"
      OLLAMA_API_KEY: "${OLLAMA_CLOUD_KEY:?set your Ollama Cloud API key}"
      LLM_MODEL: "${LLM_MODEL:-gpt-oss:120b}"
      WORKING_DIR: "/data/rag_storage"
    volumes: ["lightrag:/data/rag_storage"]

volumes:
  lightrag:
