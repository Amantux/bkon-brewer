name: BKON LightRAG
version: "0.2.0"
slug: bkon_lightrag
description: >-
  Self-contained graph-RAG service for the BKON Brewer concierge. Embeddings run
  locally (bundled); generation uses your Ollama Cloud subscription. Only the
  prompt leaves the network.
arch: [aarch64, amd64]
init: false
startup: services
boot: auto
ports:
  9621/tcp: 9621
ports_description:
  9621/tcp: LightRAG HTTP API (point the integration here)
options:
  service_api_key: "change-me"
  ollama_cloud_key: ""
  llm_model: "gpt-oss:120b"
schema:
  service_api_key: str
  ollama_cloud_key: password
  llm_model: str
map:
  - share:rw          # index storage persists here
