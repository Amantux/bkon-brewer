name: BKON LightRAG
version: "0.3.0"
slug: bkon_lightrag
description: >-
  Self-contained graph-RAG service for the BKON Brewer concierge. Embeddings run
  locally (bundled). Generation is pluggable — Ollama (local or Cloud),
  Anthropic, or any OpenAI-compatible endpoint — selected here.
arch: [aarch64, amd64]
init: false
startup: services
boot: auto
ports:
  9621/tcp: 9621
ports_description:
  9621/tcp: LightRAG HTTP API (point the integration here)
options:
  service_api_key: "change-me"
  ai_provider: "ollama"
  model: "gpt-oss:120b"
  api_key: ""
  base_url: ""
schema:
  service_api_key: str
  ai_provider: "list(ollama|anthropic|openai)"
  model: str
  api_key: password
  base_url: "str?"
map:
  - share:rw
