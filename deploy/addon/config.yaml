name: BKON LightRAG
version: "0.4.0"
slug: bkon_lightrag
description: Graph-RAG service for the BKON Brewer concierge — local embeddings, pluggable generation (Ollama / Anthropic / OpenAI-compatible).
url: https://github.com/Amantux/bkon-brewer/tree/main/deploy/addon
image: ghcr.io/amantux/bkon-lightrag-{arch}
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 9621
panel_icon: mdi:coffee-maker
panel_title: BKON RAG
apparmor: bkon_lightrag
homeassistant_api: false
hassio_api: false
ports:
  9621/tcp: null
ports_description:
  9621/tcp: LightRAG API — map only for the BKON integration / LAN access
map:
  - share:rw
options:
  service_api_key: ""
  ai_provider: "ollama"
  model: "gpt-oss:120b"
  api_key: ""
  base_url: ""
  log_level: INFO
schema:
  service_api_key: password
  ai_provider: "list(ollama|anthropic|openai)"
  model: str
  api_key: password?
  base_url: "str?"
  log_level: list(DEBUG|INFO|WARNING|ERROR)?
