name: BKON LightRAG
version: "0.1.0"
slug: bkon_lightrag
description: >-
  Graph RAG server (LightRAG) for the BKON Brewer concierge, using a local
  Ollama for the LLM and embeddings. No cloud, no API keys leave your network.
arch: [aarch64, amd64]
init: false
startup: services
boot: auto
ports:
  9621/tcp: 9621
ports_description:
  9621/tcp: LightRAG HTTP API (the integration points here)
options:
  api_key: "change-me"
  ollama_url: "http://homeassistant.local:11434"
  llm_model: "qwen2.5:3b-instruct"
  embedding_model: "nomic-embed-text"
  embedding_dim: 768
schema:
  api_key: str
  ollama_url: url
  llm_model: str
  embedding_model: str
  embedding_dim: int
map:
  - share:rw          # the built index and the input documents live here
