brew:
  name: Brew a recipe
  description: >-
    Send a recipe to the brewer as a list of steps. Validated and size-checked
    before anything reaches the radio, so a bad recipe fails at the call rather
    than half-way through the brew.
  fields:
    address:
      name: Brewer
      description: Bluetooth address. Omit if you only have one brewer.
      required: false
      selector:
        text:
    steps:
      name: Steps
      description: >-
        A list of {type, values}. Types: start, fr (fill), vc (vacuum),
        pg (purge), dialog. A brew-out is appended automatically.
      required: true
      selector:
        object:
manual_purge:
  name: Manual purge
  description: Run a single purge with the given pressure and hold time.
  fields:
    address:
      name: Brewer
      required: false
      selector:
        text:
    pressure:
      name: Pressure
      default: 50
      selector:
        number: { min: 0, max: 100, mode: box }
    time:
      name: Hold time (seconds)
      default: 10
      selector:
        number: { min: 0, max: 180, mode: box }
    detect:
      name: Detection
      default: false
      selector:
        boolean:
abort:
  name: Abort
  description: Stop the current brew immediately.
  fields:
    address:
      name: Brewer
      required: false
      selector:
        text:
respond_dialog:
  name: Answer a dialog
  description: >-
    Answer a prompt the brewer is waiting on. Button 0 is cancel and ends the
    brew. Wire form is unconfirmed against hardware — see docs/PROTOCOL.md.
  fields:
    address:
      name: Brewer
      required: false
      selector:
        text:
    button:
      name: Button
      required: true
      selector:
        number: { min: 0, max: 3, mode: box }
send_raw:
  name: Send raw frame
  description: >-
    Developer escape hatch. Send an already-framed string straight to the
    brewer, e.g. {msg:1:<PG><PS>50</PS></PG>}. For protocol work only.
  fields:
    address:
      name: Brewer
      required: false
      selector:
        text:
    payload:
      name: Payload
      required: true
      selector:
        text:
save_recipe:
  name: Save a recipe
  description: Create or overwrite a named recipe in the library. Rejected if it cannot encode.
  fields:
    name:
      name: Name
      required: true
      selector:
        text:
    steps:
      name: Steps
      description: List of {type, values}. A brew-out is appended automatically at brew time.
      required: true
      selector:
        object:
    rating:
      name: Rating
      description: Optional 1-5 star rating to store with the recipe (0 clears it).
      required: false
      selector:
        number:
          min: 0
          max: 5
          mode: slider
    notes:
      name: Notes
      description: Optional free-text notes to store with the recipe.
      required: false
      selector:
        text:
          multiline: true

rate_recipe:
  name: Rate a recipe
  description: Attach your own rating and notes to a saved recipe. Does not change the steps.
  fields:
    name:
      name: Name
      required: true
      selector:
        text:
    rating:
      name: Rating
      description: 1-5 stars. Use 0 to clear a rating. Leave empty to change only the notes.
      required: false
      selector:
        number:
          min: 0
          max: 5
          mode: slider
    notes:
      name: Notes
      description: Free-text notes — how it tasted, what to try next.
      required: false
      selector:
        text:
          multiline: true

delete_recipe:
  name: Delete a recipe
  description: Remove a saved recipe from the library.
  fields:
    name:
      name: Name
      required: true
      selector:
        text:
brew_saved:
  name: Brew a saved recipe
  description: Brew a recipe from the library by name.
  fields:
    address:
      name: Brewer
      required: false
      selector:
        text:
    name:
      name: Recipe name
      required: true
      selector:
        text:
ask:
  name: Ask the concierge
  description: >-
    Ask a question about your BKON (answered from the service documents) or
    describe a tweak to a saved recipe. Returns the answer as response data.
  fields:
    message:
      name: Message
      required: true
      example: How do I descale the machine?
      selector:
        text:
customize_recipe:
  name: Customize a recipe from feedback
  description: >-
    Adjust a saved recipe with plain language — stronger, less bitter, hotter,
    bigger, faster. Optionally save the result under a new name.
  fields:
    name:
      name: Recipe
      required: true
      selector:
        text:
    feedback:
      name: Feedback
      required: true
      example: make it a bit stronger and less bitter
      selector:
        text:
    save_as:
      name: Save result as
      description: Leave empty to only preview the change.
      required: false
      selector:
        text:
lint_recipe:
  name: Check a recipe for problems
  description: >-
    Inspect a saved recipe before brewing — size limit, missing steps,
    out-of-range values — and report each problem with a fix.
  fields:
    name:
      name: Recipe
      required: true
      selector:
        text:
diagnose:
  name: Diagnose an error or problem
  description: >-
    Explain a brewer error code (like C:3 M:5), a status, or a described
    symptom, with a likely cause and a next step.
  fields:
    text:
      name: Code or symptom
      required: true
      example: "C:3 M:5"
      selector:
        text:
build_recipe:
  name: Build a recipe from a description
  description: >-
    Create a starter recipe from a short description (e.g. "strong bold cup" or
    "delicate green tea"). Optionally save it.
  fields:
    description:
      name: Description
      required: true
      selector:
        text:
    save_as:
      name: Save as
      required: false
      selector:
        text:
get_recipe:
  name: Get a recipe
  description: Read one saved recipe — its steps, plus a quick problem check.
  fields:
    name:
      name: Recipe
      required: true
      selector:
        text:
export_recipes:
  name: Export recipes to files
  description: >-
    Write the recipe library to a directory as one JSON file per recipe, ready
    to commit to git. Deterministic output, so an unchanged library re-exports
    to a clean git status. Defaults to the bkon_recipes folder in your config.
  fields:
    directory:
      name: Directory
      description: Absolute path. Leave empty for <config>/bkon_recipes.
      required: false
      selector:
        text:
import_recipes:
  name: Import recipes from files
  description: >-
    Read recipes back from a directory of JSON files into the library. Upserts
    by default; enable Replace to mirror the files exactly (deletes recipes not
    present in the files).
  fields:
    directory:
      name: Directory
      required: false
      selector:
        text:
    replace:
      name: Replace
      description: Clear the library first, so it exactly matches the files.
      default: false
      selector:
        boolean:
download_recipes:
  name: Download recipes as text
  description: >-
    Write a readable text file of all recipes to /config/www, downloadable at
    /local/bkon/<filename> in your browser. Good for saving or sharing.
  fields:
    filename:
      name: File name
      default: bkon_recipes.txt
      required: false
      selector:
        text:
export_menu:
  name: Export a device menu file
  description: >-
    Write all recipes as one menu file in the machine's own format, downloadable
    at /local/bkon/<file>. Load it via the machine's Service Menu > Update Recipe
    File (USB) — this path is not limited to 599 bytes like a Bluetooth brew, so
    it allows longer recipes.
  fields:
    menu_name:
      name: Menu name
      required: false
      selector:
        text:
    filename:
      name: File name
      default: bkon_menu.json
      required: false
      selector:
        text:
