name: BKON LightRAG
version: "0.29.1"
slug: bkon_lightrag
description: Recipe studio and document Q&A for the BKON Brewer — a chat that builds and tunes recipes, plus optional graph-RAG over the machine’s manuals (Ollama / Anthropic / OpenAI-compatible).
url: https://github.com/Amantux/bkon-brewer/tree/main/addon
image: ghcr.io/amantux/bkon-lightrag-{arch}
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 9621
panel_icon: mdi:coffee-maker
panel_title: Bkon RAIN
# A boolean, not a profile name: the Supervisor loads addon/apparmor.txt and
# names the profile from the slug. Giving it a string here makes the whole
# config unreadable, and the add-on vanishes from the store.
apparmor: true
homeassistant_api: true
hassio_api: false
ports:
  9621/tcp: null
ports_description:
  9621/tcp: LightRAG API — map only for the BKON integration / LAN access
map:
  - share:rw
options:
  enable_lightrag: true
  service_api_key: ""
  ai_provider: "ollama"
  model: "gpt-oss:120b"
  api_key: ""
  base_url: ""
  log_level: INFO
schema:
  enable_lightrag: bool
  service_api_key: password
  ai_provider: "list(ollama|anthropic|openai)"
  model: str
  api_key: password?
  base_url: "str?"
  log_level: list(DEBUG|INFO|WARNING|ERROR)?
